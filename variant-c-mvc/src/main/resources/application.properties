server.port=19402
spring.application.name=rest-variant-C
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:19432/benchmark?currentSchema=variant_c}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:labpass}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
management.server.port=19502
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
debug=false
