global:
  scrape_interval: 5s
scrape_configs:
  - job_name: rest-benchmark
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19501]
        labels: {variant: A}
      - targets: [host.docker.internal:19502]
        labels: {variant: C}
      - targets: [host.docker.internal:19503]
        labels: {variant: D}
